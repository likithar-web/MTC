<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Login | MTC HOTEL</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f3eb;
            min-height: 100vh;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            padding: 50px 15px;

            color: #222;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 35px;

            border: 1px solid #e8e0d3;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);
        }

        /* LOGO */

        .hotel-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-symbol {
            width: 58px;
            height: 58px;

            margin: 0 auto 10px;

            border-radius: 12px;

            background: #b58a35;
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;
        }

        .logo-name {
            font-size: 28px;
            font-weight: 800;

            color: #222;

            letter-spacing: 2px;
        }

        .logo-hotel {
            font-size: 12px;

            letter-spacing: 4px;

            color: #b58a35;

            font-weight: 700;

            margin-top: 3px;
        }

        /* HEADING */

        .login-heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-heading h1 {
            font-size: 25px;
            color: #222;

            margin-bottom: 7px;
        }

        .login-heading p {
            font-size: 14px;
            color: #777;
        }

        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            font-size: 13px;
            font-weight: 600;

            color: #444;

            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd5c8;

            border-radius: 8px;

            font-size: 14px;

            outline: none;

            background: #ffffff;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #b58a35;

            box-shadow:
                0 0 0 3px
                rgba(181, 138, 53, 0.10);
        }

        /* BUTTON */

        .login-btn {
            width: 100%;

            border: none;
            border-radius: 8px;

            padding: 14px;

            background: #b58a35;
            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #9d7428;
        }

        /* ERROR */

        .error-message {
            background: #fdecec;

            color: #c0392b;

            border: 1px solid #f2caca;

            padding: 11px 13px;

            border-radius: 7px;

            font-size: 13px;

            margin-bottom: 18px;
        }

        /* REGISTER LINK */

        .register-link {
            text-align: center;

            margin-top: 22px;

            font-size: 14px;

            color: #777;
        }

        .register-link a {
            color: #b58a35;

            text-decoration: none;

            font-weight: 700;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        .footer-text {
            text-align: center;

            margin-top: 20px;

            font-size: 12px;

            color: #999;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .login-card {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <!-- MTC HOTEL LOGO -->

        <div class="hotel-logo">

            <div class="logo-symbol">
                ♨
            </div>

            <div class="logo-name">
                MTC
            </div>

            <div class="logo-hotel">
                HOTEL
            </div>

        </div>


        <!-- HEADING -->

        <div class="login-heading">

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to your MTC HOTEL account
            </p>

        </div>


        <!-- ERROR -->

        {% if error %}

        <div class="error-message">

            {{ error }}

        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST"
              action="{{ url_for('customer_login') }}">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn">

                Login

            </button>


        </form>


        <!-- REGISTER -->

        <div class="register-link">

            Don't have an account?

            <a href="{{ url_for('customer_register') }}">
                Create Account
            </a>

        </div>


    </div>


    <div class="footer-text">

        MTC HOTEL • Since 1991

    </div>


</div>


</body>

</html>
