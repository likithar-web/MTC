<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MTC HOTEL - Order Placed</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f3eb;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 600px;
            background: white;
            border: 1px solid #e5dfd3;
            border-radius: 14px;
            padding: 45px;
            text-align: center;
        }

        .success {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #b58a35;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        h1 {
            margin: 0 0 10px;
        }

        .message {
            color: #666;
            line-height: 1.6;
        }

        .order-number {
            margin: 25px 0;
            padding: 18px;
            background: #f7f3eb;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
        }

        .total {
            color: #b58a35;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            background: #b58a35;
            color: white;
            padding: 13px 22px;
            border-radius: 7px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="card">


    <div class="success">
        ✓
    </div>


    <h1>
        Order Placed Successfully!
    </h1>


    <p class="message">

        Thank you for ordering from
        <strong>MTC HOTEL</strong>.

    </p>


    <div class="order-number">

        Order #{{ order.id }}

    </div>


    <p>

        Status:
        <strong>
            {{ order.status }}
        </strong>

    </p>


    <p>

        Total:

        <strong class="total">

            ₹{{ "%.0f"|format(order.total_amount) }}

        </strong>

    </p>


    <a
        href="{{ url_for('customer_menu') }}"
        class="button"
    >

        Continue Shopping

    </a>


</div>


</body>

</html>
